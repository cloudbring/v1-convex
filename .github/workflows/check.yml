name: Check
on:
  push:
    paths:
      - '**'
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.26
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: 🔦 Run linter
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.26
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: 🪐 Check TypeScript
        run: bun run typecheck

  unit_coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.26
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: 🧪 Run unit + storybook coverage
        run: bun run test:coverage

  backend_coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.26
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Ensure backend uses Vitest v3
        run: |
          rm -rf packages/backend/node_modules
          bun install --frozen-lockfile
      - name: 🧪 Run backend coverage
        run: bun run test:backend

  e2e_smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.26
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bunx playwright install chromium --with-deps
      - name: 🚬 Run E2E smoke
        run: bun run test:e2e
