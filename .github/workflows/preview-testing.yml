name: Preview Testing
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.26

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy to Vercel Preview
        id: deploy
        run: |
          bun add -g vercel@latest
          url=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }} | tail -n 1)
          echo "preview-url=$url" >> $GITHUB_OUTPUT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Wait for deployment
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.1
        id: wait
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Run smoke tests against preview
        env:
          PREVIEW_URL: ${{ steps.wait.outputs.url }}
          BASE_URL: ${{ steps.wait.outputs.url }}
        run: |
          echo "Testing preview URL: $PREVIEW_URL"
          bun run test:smoke

      - name: Run critical E2E tests
        env:
          PREVIEW_URL: ${{ steps.wait.outputs.url }}
          BASE_URL: ${{ steps.wait.outputs.url }}
        run: |
          bunx playwright test tests/e2e/auth.spec.ts --project=chromium

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: preview-test-results
          path: |
            test-results/
            playwright-report/

      - name: Comment PR with preview URL and test results
        uses: actions/github-script@v6
        if: always()
        with:
          script: |
            const previewUrl = '${{ steps.wait.outputs.url }}';
            const testsPassed = '${{ job.status }}' === 'success';
            
            const body = `
            ## 🌐 Preview Deployment

            **Preview URL**: ${previewUrl}
            
            ### 🧪 Automated Tests
            ${testsPassed ? '✅ All tests passed' : '❌ Some tests failed'}
            
            - Smoke tests: ${testsPassed ? '✅' : '❌'}
            - Critical auth flows: ${testsPassed ? '✅' : '❌'}
            
            ${testsPassed ? 
              '🎉 Preview is ready for testing!' : 
              '⚠️ Please check the failed tests before merging.'
            }
            
            ---
            *This comment was automatically generated by the preview testing workflow*
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
