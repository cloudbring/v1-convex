name: E2E On-Demand

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test (e.g. preview deployment)"
        required: true
        default: "http://localhost:3000"
      browsers:
        description: "Browsers to run (chromium or all)"
        required: true
        default: chromium
  pull_request:
    types: [labeled]

jobs:
  e2e_full:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-e2e-full')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.26
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: |
          if [ "${{ github.event.inputs.browsers }}" = "all" ]; then
            bunx playwright install --with-deps chromium firefox webkit
          else
            bunx playwright install --with-deps chromium
          fi
      - name: Run full E2E suite
        env:
          BASE_URL: ${{ github.event.inputs.base_url || vars.DEFAULT_BASE_URL || '' }}
        run: |
          if [ "${{ github.event.inputs.browsers }}" = "all" ]; then
            bun run test:e2e:full
          else
            bunx playwright test --project=chromium
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
      - name: Comment PR with E2E results link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${{ toJson(github.server_url) }}/${{ toJson(github.repository) }}/actions/runs/${{ github.run_id }}`.replaceAll('"','');
            const label = 'run-e2e-full';
            const baseUrl = `${{ github.event.inputs.base_url || '' }}`;
            const browsers = `${{ github.event.inputs.browsers || 'chromium' }}`;
            const body = [
              `🧪 Full E2E suite triggered (label: ${label}).`,
              `- Run: ${runUrl}`,
              baseUrl ? `- BASE_URL: ${baseUrl}` : null,
              `- Browsers: ${browsers}`,
              '',
              'Artifacts will include the Playwright HTML report.'
            ].filter(Boolean).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
