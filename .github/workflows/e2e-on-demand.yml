name: E2E On-Demand

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test (e.g. preview deployment)"
        required: true
        default: "http://localhost:3000"
  pull_request:
    types: [labeled]

jobs:
  e2e_full:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-e2e-full')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.26
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bunx playwright install chromium --with-deps
      - name: Run full E2E suite
        env:
          BASE_URL: ${{ github.event.inputs.base_url || vars.DEFAULT_BASE_URL || '' }}
        run: bun run test:e2e:full
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

